# Compose para la guía ms-catalogo: coincide con el config-data del repo del profesor
# (jdbc:postgresql://localhost:5433/ms_catalogo, usuario postgres, clave 12345678)
# MySQL para ms-producto-service: jdbc:mysql://localhost:3306/ms_producto, usuario root, clave 12345678

services:
  postgres-catalogo:
    image: postgres:17.9
    container_name: postgres-catalogo
    restart: always
    ports:
      - 5433:5432          # host 5433 -> contenedor 5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345678
      - POSTGRES_DB=ms_catalogo
    volumes:
      - ./postgres-catalogo:/var/lib/postgresql/data

  pgadmin-catalogo:
    image: dpage/pgadmin4
    container_name: pgadmin-catalogo
    restart: always
    depends_on:
      - postgres-catalogo
    ports:
      - 5050:80            # 8080 lo usa tu otro pgAdmin; 8081 lo usa ms-catalogo-service
    environment:
      - PGADMIN_DEFAULT_EMAIL=alumno@google.com
      - PGADMIN_DEFAULT_PASSWORD=123456
    volumes:
      - ./pgadmin-catalogo:/var/lib/pgadmin

  mysql-producto:
    image: mysql:8.4
    container_name: mysql-producto
    restart: always
    ports:
      - 3306:3306          # host 3306 -> contenedor 3306
    environment:
      - MYSQL_ROOT_PASSWORD=12345678
      - MYSQL_DATABASE=ms_producto
    volumes:
      - ./mysql-producto:/var/lib/mysql
